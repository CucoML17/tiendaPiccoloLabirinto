<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Tienda</title>

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Estilos Globales del Sistema -->
    <link rel="stylesheet" href="css/estilosGlobales.css">
</head>
<body>

    <div class="login-card">
        <!-- Encabezado -->
        <div class="login-header">
            <h4>Panel Administrativo</h4>
            <p class="login-subtitle" style="font-size: 14px; font-weight: bold;">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Formulario -->
        <div class="login-body">
            <form id="formLogin" novalidate autocomplete="off">
                <!-- Usuario -->
                <div class="form-group mb-4">
                    <label for="username" class="font-weight-bold text-dark small mb-1">Usuario</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" id="username" class="form-control"  placeholder="Escriba su usuario" required >
                    </div>
                </div>

                <!-- Contraseña con ojito para alternar visibilidad -->
                <div class="form-group mb-4">
                    <label for="contrasena" class="font-weight-bold text-dark small mb-1">Contraseña</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" id="contrasena" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <div class="input-group-append">
                            <span class="input-group-text toggle-password" id="btnTogglePassword">
                                <i class="fas fa-eye" id="iconEye"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Botón de Ingreso -->
                <button type="submit" id="btnIngresar" class="btn btn-dark-custom btn-block mb-3">
                    <i class="fas fa-sign-in-alt mr-2"></i> Iniciar Sesión
                </button>

                <!-- Botón Regresar al Sitio Público -->
                <a href="index.html" class="btn-outline-secondary-custom">
                    <i class="fas fa-arrow-left mr-1"></i> Regresar a la Tienda
                </a>
            </form>
        </div>
    </div>

    <!-- Contenedor Toast para alertas -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <!-- Script de la lógica del Login -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
