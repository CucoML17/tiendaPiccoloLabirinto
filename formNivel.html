<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Formulario de Nivel - Panel Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <!-- Hoja de Estilos Reusable Admin -->
    <link rel="stylesheet" href="css/adminstyle.css">
    <link rel="stylesheet" href="css/globalAdminEstilos.css">
    <script type="module" src="js/auth-guard.js"></script>

    <style>
        .color-picker-wrapper {
            position: relative;
            display: inline-block;
        }

        .color-picker-hidden {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
        }

        .color-swatch-preview {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            border: 2px solid #dee2e6;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .preview-text-display {
            font-size: 1.25rem;
            font-weight: 700;
            transition: color 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Contenedor del Header Administrativo -->
    <header id="header-container"></header>

    <!-- Área de Trabajo Principal -->
    <main class="container my-2" style="max-width: 1000px;">

        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="font-weight-bold text-dark m-0" id="tituloFormulario">
                    Registrar Nuevo Nivel
                </h5>
            </div>
            
            <div class="card-body p-4">
                <form id="formNivel" class="needs-validation" novalidate>
                    
                    <!-- Campo: Nombre del Nivel -->
                    <div class="form-group mb-3">
                        <label for="nombreNivel" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                            Nombre del nivel <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light"><i class="fas fa-layer-group text-muted"></i></span>
                            </div>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="nombreNivel" 
                                name="nombreNivel"
                                placeholder="Ej. Principiante, Nivel 1, Avanzado" 
                                required 
                                pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s]+$"
                                maxlength="50"
                                autocomplete="off"
                            >
                            <div class="invalid-feedback">
                                Por favor ingresa un nombre válido (letras, números y espacios. Sin caracteres especiales como /=$, etc.).
                            </div>
                        </div>
                    </div>


                    <!-- Campo: Grado de Dificultad -->
                    <div class="form-group mb-3">
                        <label for="nivelDificultad" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                            Grado de dificultad <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light"><i class="fas fa-tachometer-alt text-muted"></i></span>
                            </div>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="nivelDificultad" 
                                name="nivelDificultad"
                                placeholder="Ej. 1" 
                                min="1" 
                                max="10" 
                                step="1"
                                required 
                                autocomplete="off"
                            >
                            <div class="invalid-feedback" id="feedbackDificultad">
                                Por favor ingresa un número entero entre 1 y 10.
                            </div>
                        </div>
                        <small class="form-text text-muted">
                            <i class="fas fa-info-circle mr-1"></i>De 1 a 10, donde 1 es fácil y 10 muy difícil.
                        </small>
                    </div>                    

                    <!-- Campo: Color Representativo -->
                    <div class="form-group mb-4">
                        <label class="font-weight-bold text-dark small mt-0 mb-1 d-block">
                            Color representativo <span class="text-danger">*</span>
                        </label>

                        <div class="d-flex align-items-center">
                            <div class="color-picker-wrapper mr-3">
                                <button type="button" class="btn btn-outline-secondary font-weight-bold" id="btnEscogerColor">
                                    <i class="fas fa-palette mr-1"></i> Escoger color
                                </button>
                                <input type="color" id="colorPicker" name="colorNivel" value="#000000" class="color-picker-hidden">
                            </div>

                            <div id="colorSwatch" class="color-swatch-preview" style="background-color: #000000;" title="Color seleccionado"></div>
                        </div>
                    </div>

                    <!-- Previsualización en Tiempo Real del Texto -->
                    <div class="card bg-white border mb-4 shadow-sm">
                        <div class="card-body p-3">
                            <span class="font-weight-bold text-dark small d-block mb-2">
                                <i class="fas fa-eye mr-1"></i> Previsualización:
                            </span>
                            <div class="py-2">
                                <span id="previewTexto" class="preview-text-display" style="color: #000000;">
                                    Nombre del nivel
                                </span>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Botones de Acción Responsivos -->
                    <div class="d-flex flex-row justify-content-center align-items-center">
                        <a href="panelNiveles.html" class="btn btn-admin-clear font-weight-bold w-100 w-sm-auto px-4 mx-1 mx-sm-2 mb-0" style="min-width: 200px; max-width: 100%;">
                            <i class="fas fa-times mr-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-dark font-weight-bold w-100 w-sm-auto px-4 mx-1 mx-sm-2" style="min-width: 200px; max-width: 100%;">
                            <i class="fas fa-save mr-1"></i> Guardar
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>
    
    <div id="footer-container"></div>

    <script src="js/footer-js.js"></script>    

    <!-- Script de Inyección del Header Admin -->
    <script src="js/cargador-header.js"></script>

    <!-- JS Dependencias -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/13c51e858e.js" crossorigin="anonymous"></script>

    <!-- Script ES6 Module con lógica de Firebase Firestore -->
    <script type="module" src="js/firebase-nivel.js"></script>
    <script type="module" src="js/header-admin.js"></script>
</body>
</html>
