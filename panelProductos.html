<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gestión de Productos - Panel Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    
    <!-- Hojas de Estilos Reusables Admin -->
    <link rel="stylesheet" href="css/adminstyle.css">
    <link rel="stylesheet" href="css/globalAdminEstilos.css">

    <style>

    </style>

    <script type="module" src="js/auth-guard.js"></script>
    
    <style>
        /* Estilos específicos para la vista previa de imágenes de productos */
        .thumb-producto-container {
            width: 60px;
            height: 60px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .thumb-producto {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garantiza que la imagen llene el espacio sin deformarse */
        }

        /* Color personalizado Teal para el botón de Re-stock */
        .btn-teal {
            background-color: #20c997;
            border-color: #20c997;
            color: #ffffff;
        }
        .btn-teal:hover {
            background-color: #1baa80;
            border-color: #1baa80;
            color: #ffffff;
        }

            .acciones-grid-movil .btn-circle-sm {
        margin: 2px !important;
    }
    </style>
</head>
<body class="bg-light">

    <!-- Contenedor del Header Administrativo -->
    <header id="header-container"></header>

    <!-- Área de Trabajo Principal -->
    <main class="container my-3" style="max-width: 1350px;">

        <!-- Encabezado de Sección -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="font-weight-bold text-dark m-0">
                Gestión de Productos
            </h4>
        </div>

        <!-- 1. SECCIÓN: BARRA DE FILTRADO (COLAPSABLE) -->
        <div class="card mb-2 shadow-sm border-0">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                <span class="font-weight-bold text-dark small">
                    <i class="fas fa-filter mr-1"></i> Filtros de búsqueda
                </span>
                <button class="btn btn-sm btn-outline-secondary py-0 px-2" type="button" data-toggle="collapse" data-target="#collapseFiltros" aria-expanded="true" aria-controls="collapseFiltros">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
            
            <div class="collapse show" id="collapseFiltros">
                <div class="card-body bg-white py-2">
                    <form class="form-row align-items-end" onsubmit="event.preventDefault();">
                        
                        <!-- Filtro por Nombre -->
                        <div class="col-12 col-md-6 col-lg-3 mb-2">
                            <label for="filtroNombre" class="small font-weight-bold text-dark mb-1 d-block">Nombre</label>
                            <div class="input-group input-group-sm">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light"><i class="fas fa-search text-muted"></i></span>
                                </div>
                                <input type="text" class="form-control form-control-sm" id="filtroNombre" placeholder="Buscar por producto..." autocomplete="off">
                            </div>
                        </div>

                        <!-- Filtro por Categoría -->
                        <div class="col-filtro-custom col-md-6 col-lg-3 mb-2">
                            <label for="filtroCategoria" class="small font-weight-bold text-dark mb-1 d-block">Categoría</label>
                            <select class="form-control form-control-sm" id="filtroCategoria" style="height: 31px;">
                                <option value="">Todas las categorías</option>
                                <!-- Se poblará dinámicamente -->
                            </select>
                        </div>

                        <!-- Filtro por Nivel -->
                        <div class="col-filtro-custom col-md-6 col-lg-2 mb-2">
                            <label for="filtroNivel" class="small font-weight-bold text-dark mb-1 d-block">Dificultad / Nivel</label>
                            <select class="form-control form-control-sm" id="filtroNivel" style="height: 31px;">
                                <option value="">Todos los niveles</option>
                                <!-- Se poblará dinámicamente -->
                            </select>
                        </div>

                        <!-- Rango de Precios -->
                        <div class="col-12 col-md-6 col-lg-3 mb-2">
                            <label class="small font-weight-bold text-dark mb-1 d-block">Precio ($)</label>
                            <div class="input-group input-group-sm">
                                <input type="number" step="0.01" class="form-control form-control-sm" id="filtroPrecioMin" placeholder="Mín">
                                <div class="input-group-prepend input-group-append">
                                    <span class="input-group-text bg-light px-1 py-0 border-left-0 border-right-0 small" style="line-height: 1;">-</span>
                                </div>
                                <input type="number" step="0.01" class="form-control form-control-sm" id="filtroPrecioMax" placeholder="Máx">
                            </div>
                        </div>

                        <!-- Botón Limpiar -->
                        <div class="col-12 col-lg-1 mb-2">
                            <label class="small mb-1 d-none d-lg-block" style="visibility: hidden;">&nbsp;</label>
                            <button type="button" class="btn btn-admin-clear btn-sm btn-block font-weight-bold" id="btnLimpiarFiltros" title="Limpiar filtros" style="height: 31px; line-height: 1;">
                                <i class="fas fa-eraser mr-1"></i> Limpiar
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <!-- ACCIÓN SUPERIOR Y TABLA -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-3">
                
                <!-- Botón Nuevo Producto -->
                <div class="d-flex justify-content-start mb-2">
                    <a href="formProducto.html" class="btn btn-admin-primary btn-sm font-weight-bold btn-nuevo-producto-movil">
                        <i class="fas fa-plus mr-1"></i> Nuevo producto
                    </a>
                </div>

                <!-- 2. SECCIÓN: TABLA CON CATEGORÍA Y NIVEL -->
                <div class="table-scroll-container border rounded">
                    <table class="table table-hover table-striped table-bordered table-dense m-0">
                        <thead class="thead-dark">
                            <tr>
                                <th scope="col" class="text-center" style="width: 70px;">Producto</th>
                                <th scope="col" class="d-none d-sm-table-cell" style="width: 18%;">Nombre</th>
                                <th scope="col" style="width: 25%;">Descripción</th>
                                <th scope="col" class="text-center" style="width: 15%;">Categoría / Nivel</th>
                                <th scope="col" class="text-center d-none d-sm-table-cell" style="width: 10%;">Nivel</th>
                                <th scope="col" class="text-center d-none d-sm-table-cell" style="width: 10%;">Precio</th>
                                <th scope="col" class="text-center" style="width: 8%;">Stock</th>
                                <th scope="col" class="text-center" style="width: 110px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosBody">
                            <!-- Ejemplo visual con texto limpio -->

                        </tbody>
                    </table>
                </div>

                <nav class="d-flex justify-content-center mt-3" aria-label="Paginación de productos">
                    <ul class="pagination pagination-sm m-0" id="contenedorPaginacion">
                        <!-- Se genera dinámicamente desde JS -->
                    </ul>
                </nav>                

            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="js/footer-js.js"></script>    

    <!-- Script de Inyección del Header Admin -->
    <script src="js/cargador-header.js"></script>

    <!-- JS Dependencias -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/13c51e858e.js" crossorigin="anonymous"></script>

    <!-- Script de Integración con Firestore -->
    <script type="module" src="js/panel-producto.js"></script>
    <script type="module" src="js/header-admin.js"></script>
</body>
</html>
