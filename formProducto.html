<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Formulario de Producto - Panel Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <!-- Hoja de Estilos Reusable Admin -->
    <link rel="stylesheet" href="css/adminstyle.css">
    <link rel="stylesheet" href="css/globalAdminEstilos.css">

    <script type="module" src="js/auth-guard.js"></script>

    <style>
        /* Estilo general para la Previsualización de Imagen */
        .img-preview-container {
            width: 100%;
            height: 210px;
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 5px; /* Espaciado de seguridad interno */
        }

        .img-preview-container img {
            width: 100%;
            height: 100%;
            /* SOLUCIÓN AL RECORTE: 'contain' ajusta la imagen sin cortar bordes */
            object-fit: contain; 
            display: none;
        }

        .img-preview-placeholder {
            text-align: center;
            color: #6c757d;
        }

        /* AJUSTES RESPONSIVOS EXCLUSIVOS PARA SMARTPHONES (Pantallas < 576px) */
        @media (max-width: 575.98px) {
            #formTitle {
                font-size: 1.1rem !important;
            }

            .form-control, 
            .custom-file-label,
            .input-group-text {
                height: calc(1.5em + 0.5rem + 2px) !important;
                padding: 0.25rem 0.5rem !important;
                font-size: 0.875rem !important;
            }

            .custom-file, .custom-file-label {
                height: calc(1.5em + 0.5rem + 2px) !important;
                line-height: 1.5 !important;
            }

            .custom-file-label::after {
                height: calc(1.5em + 0.5rem) !important;
                padding: 0.25rem 0.5rem !important;
                line-height: 1.5 !important;
            }

            .img-preview-container {
                height: 160px; /* Altura optimizada en teléfonos */
            }

            .img-preview-placeholder i {
                font-size: 2rem !important;
            }

            .card-body {
                padding: 1rem !important;
            }
            
            label {
                font-size: 0.78rem !important;
            }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Contenedor del Header Administrativo -->
    <header id="header-container"></header>

    <!-- Área de Trabajo Principal -->
    <main class="container my-2" style="max-width: 1000px;">

        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="font-weight-bold text-dark m-0" id="formTitle">
                    Registrar Nuevo Producto
                </h5>
            </div>

            <div class="card-body p-4">
                <form id="formProducto" class="needs-validation" novalidate>

                    <!-- BLOQUE SUPERIOR -->
                    <div class="row">
                        
                        <!-- Columna Izquierda en PC / Bloque de Datos -->
                        <div class="col-12 col-md-8 d-flex flex-column">

                            <!-- 1. Nombre del Producto -->
                            <div class="form-group mb-3">
                                <label for="nombreProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                    Nombre del producto <span class="text-danger">*</span>
                                </label>
                                <div class="input-group has-validation">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light"><i class="fas fa-box text-muted"></i></span>
                                    </div>
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        id="nombreProducto" 
                                        name="nombreProducto"
                                        placeholder="Escriba cómo se llama el producto" 
                                        required 
                                        maxlength="100"
                                        pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s.,]+$"
                                        autocomplete="off"
                                    >
                                    <div class="invalid-feedback">
                                        Ingresa un nombre válido.
                                    </div>
                                </div>
                            </div>

                            <!-- 2. Input Seleccionar Imagen -->
                            <div class="form-group mb-3">
                                <label for="imagenProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                    Imagen del producto <span class="text-danger">*</span>
                                </label>
                                <div class="custom-file has-validation">
                                    <input 
                                        type="file" 
                                        class="custom-file-input" 
                                        id="imagenProducto" 
                                        accept="image/png, image/jpeg, image/webp"
                                        required
                                    >
                                    <label class="custom-file-label text-truncate" for="imagenProducto" data-browse="Buscar" id="labelImagen">Seleccionar imagen...</label>
                                    <div class="invalid-feedback" id="feedbackImagen">
                                        Por favor selecciona una imagen válida (.jpg, .png, .webp).
                                    </div>
                                </div>
                            </div>

                            <!-- 3. Vista previa de Imagen (Se muestra AQUÍ únicamente en Móviles) -->
                            <div class="d-block d-md-none mb-3">
                                <label class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                    Vista previa
                                </label>
                                <div class="img-preview-container">
                                    <div class="img-preview-placeholder preview-placeholder-mobile">
                                        <i class="fas fa-image fa-2x mb-1"></i>
                                        <p class="small m-0">Sin imagen seleccionada</p>
                                    </div>
                                    <img class="img-preview-element" src="#" alt="Vista previa de imagen">
                                </div>
                            </div>

                            <!-- 4. Categoría y Nivel (2 columnas en móviles) -->
                            <div class="form-row">
                                <div class="form-group col-6 mb-3">
                                    <label for="categoriaProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                        Categoría <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group has-validation">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text bg-light"><i class="fas fa-tags text-muted"></i></span>
                                        </div>
                                        <select class="form-control" id="categoriaProducto" name="categoriaProducto" required>
                                            <option value="" selected disabled>Seleccionar...</option>
                                        </select>
                                        <div class="invalid-feedback">
                                            Selecciona una categoría.
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group col-6 mb-3">
                                    <label for="nivelProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                        Nivel / Dificultad <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group has-validation">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text bg-light"><i class="fas fa-layer-group text-muted"></i></span>
                                        </div>
                                        <select class="form-control" id="nivelProducto" name="nivelProducto" required>
                                            <option value="" selected disabled>Seleccionar...</option>
                                        </select>
                                        <div class="invalid-feedback">
                                            Selecciona un nivel.
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Columna Derecha en PC / Vista previa (Se muestra AQUÍ en pantallas MD o superiores) -->
                        <div class="col-12 col-md-4 d-none d-md-flex flex-column justify-content-center mb-3 mb-md-0">
                            <label class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                Vista previa
                            </label>
                            <div class="img-preview-container">
                                <div class="img-preview-placeholder preview-placeholder-desktop">
                                    <i class="fas fa-image fa-3x mb-2"></i>
                                    <p class="small m-0">Sin imagen seleccionada</p>
                                </div>
                                <img class="img-preview-element" src="#" alt="Vista previa de imagen">
                            </div>
                        </div>

                    </div>

                    <!-- BLOQUE INFERIOR: Precio y Cantidad -->
                    <div class="form-row">
                        <div class="form-group col-6 col-md-6 mb-3">
                            <label for="precioProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                Precio ($) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group has-validation">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light"><i class="fas fa-dollar-sign text-muted"></i></span>
                                </div>
                                <input 
                                    type="number" 
                                    step="1" 
                                    min="1" 
                                    class="form-control" 
                                    id="precioProducto" 
                                    name="precioProducto"
                                    placeholder="0.00" 
                                    required
                                    onwheel="this.blur()"
                                >
                                <div class="invalid-feedback">
                                    Ingresa un precio válido.
                                </div>
                            </div>
                        </div>

                        <div class="form-group col-6 col-md-6 mb-3">
                            <label for="cantidadProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                                Cantidad (Stock) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group has-validation">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light"><i class="fas fa-cubes text-muted"></i></span>
                                </div>
                                <input 
                                    type="number" 
                                    min="1" 
                                    step="1" 
                                    class="form-control" 
                                    id="cantidadProducto" 
                                    name="cantidadProducto"
                                    placeholder="0" 
                                    required
                                    onwheel="this.blur()"
                                >
                                <div class="invalid-feedback">
                                    Ingresa una cantidad válida.
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BLOQUE COMPLETO: Descripción -->
                    <div class="form-group mb-2">
                        <label for="descripcionProducto" class="font-weight-bold text-dark small mt-0 mb-1 d-inline-block">
                            Descripción del producto
                        </label>
                        <div class="has-validation">
                            <textarea 
                                class="form-control" 
                                id="descripcionProducto" 
                                name="descripcionProducto" 
                                rows="3" 
                                placeholder="Escribe una breve descripción del producto..." 
                                maxlength="500"
                            ></textarea>
                            <!-- Puedes quitar también el <div class="invalid-feedback"> ya que al ser opcional no se usará -->
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Botones de Acción -->
                    <!-- Botones de Acción -->
                    <div class="d-flex flex-row justify-content-center align-items-center">
                        <a href="panelProductos.html" class="btn btn-admin-clear font-weight-bold w-100 w-sm-auto px-4 mx-1 mx-sm-2 mb-0" style="min-width: 200px; max-width: 100%;">
                            <i class="fas fa-times mr-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-dark font-weight-bold w-100 w-sm-auto px-4 mx-1 mx-sm-2" style="min-width: 200px; max-width: 100%;">
                            <i class="fas fa-save mr-1"></i> Guardar
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="js/footer-js.js"></script>    

    <!-- Scripts de Carga del Header y Lógica -->
    <script src="js/cargador-header.js"></script>
    
    <script>
        // Previsualización de Imagen que actualiza ambas vistas (Móvil y PC)
        document.getElementById('imagenProducto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const labelImagen = document.getElementById('labelImagen');
            const imgPreviews = document.querySelectorAll('.img-preview-element');
            const previewPlaceholders = document.querySelectorAll('.img-preview-placeholder');

            if (file) {
                labelImagen.innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreviews.forEach(img => {
                        img.src = e.target.result;
                        img.style.display = 'block';
                    });
                    previewPlaceholders.forEach(placeholder => {
                        placeholder.style.display = 'none';
                    });
                }
                reader.readAsDataURL(file);
            } else {
                labelImagen.innerText = 'Seleccionar imagen...';
                imgPreviews.forEach(img => {
                    img.src = '#';
                    img.style.display = 'none';
                });
                previewPlaceholders.forEach(placeholder => {
                    placeholder.style.display = 'block';
                });
            }
        });
    </script>

    <!-- JS Dependencias -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/13c51e858e.js" crossorigin="anonymous"></script>

    <!-- Script ES6 Module con lógica de Firebase Firestore -->
    <script type="module" src="js/firebase-producto.js"></script>
    <script type="module" src="js/header-admin.js"></script>
</body>
</html>
