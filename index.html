<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Picolo labirinto - Catálogo de Productos</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">


    <style>
        #header-container {
            display: contents;
        }

        .card-product {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-product:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .product-img-wrapper {
            height: 200px;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .badge-nivel {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            font-weight: 600;
        }
    </style>

    <link rel="stylesheet" href="css/estilosNuevosGlobales.css">
</head>
<body>

    <!-- Header Dinámico cargado mediante Fetch -->
    <header id="header-container"></header>

    <!-- GRID DE PRODUCTOS -->
    <main class="container-fluid px-3 px-md-5 my-4">
        <section class="row" id="productosContainer">
            <div class="col-12 text-center my-5" id="spinnerCargando">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                    <span class="sr-only">Cargando productos...</span>
                </div>
                <p class="mt-2 text-muted">Cargando catálogo...</p>
            </div>
        </section>


        <nav aria-label="Navegación de productos" class="my-4">
            <ul class="pagination justify-content-center" id="paginacionContainer"></ul>
        </nav>  
        
        
        
    </main>

    <div id="footer-container"></div>

    <script src="js/footer-js.js"></script>

    <!-- Bootstrap JS & Dependencias -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/13c51e858e.js" crossorigin="anonymous"></script>

    <!-- Script Controlador en Módulo -->
    <script type="module" src="js/index-js.js"></script>
</body>
</html>
